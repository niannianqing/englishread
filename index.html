<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语阅读">
<title>英语阅读 📚</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#6C63FF;--primary2:#8B85FF;--primary-bg:#F0EFFF;
  --green:#22C27A;--green-bg:#E8FAF2;
  --amber:#F59E0B;--amber-bg:#FEF3C7;
  --red:#EF4444;--red-bg:#FEE2E2;
  --text1:#1A1A2E;--text2:#6B7280;--text3:#9CA3AF;
  --bg:#FAFAFA;--card:#FFFFFF;--border:#E5E7EB;
  --radius:20px;--radius-sm:12px;
  --font:'Nunito',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text1)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* HOME */
#home{background:linear-gradient(160deg,#EEF2FF 0%,#F5F3FF 50%,#FFF7ED 100%)}
.home-header{padding:48px 28px 20px;text-align:center}
.home-avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(108,99,255,.3)}
.home-greeting{font-size:26px;font-weight:900;color:var(--text1)}
.home-date{font-size:15px;color:var(--text2);margin-top:4px;font-weight:600}
.progress-ring-wrap{margin:16px auto;width:120px;height:120px;position:relative}
.progress-ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#E5E7EB;stroke-width:10}
.ring-fill{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:28px;font-weight:900;color:var(--primary)}
.ring-sub{font-size:11px;font-weight:700;color:var(--text2)}
.home-scroll{flex:1;overflow-y:auto;padding:0 20px 120px}
.section-label{font-size:13px;font-weight:800;color:var(--text2);letter-spacing:.5px;margin:16px 0 10px;text-transform:uppercase}
.task-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.task-card:active{transform:scale(.98)}
.task-card.done{border-color:var(--green);opacity:.75}
.task-card.done .task-card-title{text-decoration:line-through;color:var(--text2)}
.task-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.icon-new{background:var(--primary-bg)}.icon-rev{background:var(--amber-bg)}.icon-done{background:var(--green-bg)}
.task-card-info{flex:1;min-width:0}
.task-card-title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-card-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pill-raz{background:#DBEAFE;color:#1D4ED8}.pill-ox{background:#DCFCE7;color:#166534}
.pill-rr{background:#FEE2E2;color:#991B1B}.pill-rev{background:var(--amber-bg);color:#92400E}
.pill-new{background:var(--primary-bg);color:#4338CA}.pill-carry{background:#FFE4E6;color:#9F1239}
.pill-lv{background:#F3F4F6;color:#374151}
.task-score-badge{font-size:18px;font-weight:900;color:var(--green)}
.task-checks{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.mini-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .15s;background:var(--bg)}
.mini-check.on{background:var(--green);border-color:var(--green);color:#fff}
.mini-check-lbl{font-size:9px;font-weight:800;color:var(--text3);text-align:center;margin-top:1px}
.fab{position:fixed;bottom:calc(28px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;border-radius:30px;padding:16px 36px;font-size:17px;font-weight:800;font-family:var(--font);cursor:pointer;box-shadow:0 8px 24px rgba(108,99,255,.4);display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.96)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-state .e-icon{font-size:56px;margin-bottom:16px}
.empty-state p{font-size:16px;font-weight:700}
.empty-state small{font-size:13px;color:var(--text3)}

/* READING SCREEN */
#reading{background:#1A1A2E}
.reading-header{padding:52px 20px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.back-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.r-title{font-size:17px;font-weight:800;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-page-ind{font-size:13px;color:rgba(255,255,255,.5);font-weight:700;flex-shrink:0}

/* PAGE DISPLAY — unified image+text layout */
.page-display{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}

/* Image area (top 58%) */
.page-img-wrap{flex:0 0 58%;position:relative;overflow:hidden;background:#111;touch-action:pan-y}
.page-img-wrap img{width:100%;height:100%;object-fit:contain;display:block;border-radius:0}
.page-img-wrap canvas{width:100%;height:100%;object-fit:contain;display:block}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:14px;font-weight:700;background:#111}

/* Swipe hint dots */
.swipe-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.swipe-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .2s}
.swipe-dot.on{background:#fff;width:16px;border-radius:3px}

/* Text area (bottom) */
.page-text-band{flex:1;background:#1A1A2E;padding:14px 20px 6px;overflow-y:auto;min-height:0}
.page-text-inner{font-size:20px;font-weight:700;color:#fff;line-height:1.75;text-align:center}
.word{display:inline;padding:1px 2px;border-radius:4px;transition:background .2s}
.word.hit{background:rgba(34,194,122,.35);color:#6EE7B7}
.no-text-hint{font-size:14px;color:rgba(255,255,255,.25);text-align:center;padding:16px 0}

/* Legacy pdf-only canvas (hidden in new mode) */
.pdf-canvas-wrap{display:none}
#pdf-canvas{display:none}
.page-text-card{display:none}

/* VOICE */
.voice-area{background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;flex-shrink:0}
.voice-row{display:flex;align-items:center;gap:12px}
.mic-btn{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.mic-btn.idle{background:var(--primary);box-shadow:0 6px 20px rgba(108,99,255,.5)}
.mic-btn.rec{background:var(--red);animation:pulse-red 1s infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.voice-info{flex:1;min-width:0}
.voice-status{font-size:13px;font-weight:700;color:rgba(255,255,255,.8)}
.voice-transcript{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-display{text-align:center;flex-shrink:0}
.score-num{font-size:34px;font-weight:900;color:var(--green);line-height:1}
.score-lbl{font-size:10px;color:rgba(255,255,255,.4);font-weight:700;margin-top:1px}

.reading-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + var(--safe-bottom));background:rgba(0,0,0,.3);flex-shrink:0}
.page-nav-btn{padding:13px 26px;border-radius:var(--radius-sm);border:none;font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;transition:all .15s}
.page-nav-btn:active{transform:scale(.96)}
.page-nav-prev{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.page-nav-next{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(108,99,255,.4)}
.session-avg{font-size:13px;font-weight:700;color:rgba(255,255,255,.5);text-align:center}

/* QUIZ SCREEN */
#quiz{background:linear-gradient(160deg,#EEF2FF,#F5F3FF)}
.quiz-inner{flex:1;display:flex;flex-direction:column;padding:52px 24px 24px;overflow-y:auto}
.quiz-header{text-align:center;margin-bottom:28px}
.quiz-book-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:6px}
.quiz-progress{font-size:13px;font-weight:800;color:var(--primary)}
.quiz-progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .4s}
.quiz-q-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08);margin-bottom:20px;min-height:80px;display:flex;align-items:center;justify-content:center}
.quiz-q-text{font-size:18px;font-weight:800;color:var(--text1);line-height:1.5;text-align:center}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.quiz-opt{background:var(--card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;font-size:16px;font-weight:700;color:var(--text1);cursor:pointer;text-align:left;font-family:var(--font);transition:all .2s}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:#166534}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-bg);color:#991B1B}
.quiz-feedback{text-align:center;padding:10px;font-size:14px;font-weight:700;min-height:40px;color:var(--text2)}
.quiz-next-btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:16px;font-weight:800;font-family:var(--font);cursor:pointer;width:100%;opacity:0;pointer-events:none;transition:opacity .3s}
.quiz-next-btn.show{opacity:1;pointer-events:auto}
.quiz-loading{text-align:center;padding:60px 20px;color:var(--text2)}
.quiz-loading .spinner{font-size:40px;animation:spin 1.5s linear infinite;display:block;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-result-trophy{font-size:72px;margin-bottom:16px;animation:bounce .6s both}
.quiz-result-score{font-size:48px;font-weight:900;color:var(--primary);margin-bottom:8px}
.quiz-result-label{font-size:16px;color:var(--text2);font-weight:600;margin-bottom:28px}
#finish{background:linear-gradient(160deg,#EEF2FF,#F5F3FF)}
.finish-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;overflow-y:auto}
.finish-trophy{font-size:80px;margin-bottom:20px;animation:bounce .6s .2s both}
@keyframes bounce{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.finish-title{font-size:30px;font-weight:900;color:var(--primary);margin-bottom:8px}
.finish-sub{font-size:16px;color:var(--text2);font-weight:600}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0;width:100%}
.score-box{background:var(--card);border-radius:var(--radius-sm);padding:16px 8px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.score-box-num{font-size:28px;font-weight:900;color:var(--primary)}
.score-box-lbl{font-size:12px;font-weight:700;color:var(--text2);margin-top:4px}
.page-scores-list{background:var(--card);border-radius:var(--radius-sm);padding:16px;width:100%;margin-bottom:24px;text-align:left;max-height:200px;overflow-y:auto}
.page-score-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px;font-weight:700}
.page-score-row:last-child{border:none}
.btn-done{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;border-radius:var(--radius);padding:18px 48px;font-size:18px;font-weight:800;font-family:var(--font);cursor:pointer;box-shadow:0 8px 24px rgba(108,99,255,.35)}
.btn-done:active{transform:scale(.97)}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-header">
    <div class="home-avatar">📚</div>
    <div class="home-greeting" id="greeting">加油！</div>
    <div class="home-date" id="today-label"></div>
    <div class="progress-ring-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="50"/>
        <circle class="ring-fill" id="ring" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"/>
      </svg>
      <div class="ring-label">
        <div class="ring-num" id="ring-num">0/0</div>
        <div class="ring-sub">完成</div>
      </div>
    </div>
  </div>
  <div class="home-scroll" id="home-scroll">
    <div id="task-container"></div>
  </div>
  <button class="fab" onclick="generateTasks()">✨ 生成今日任务</button>
</div>

<!-- READING -->
<div class="screen" id="reading">
  <div class="reading-header">
    <button class="back-btn" onclick="exitReading()">←</button>
    <div class="r-title" id="r-title">-</div>
    <div class="r-page-ind" id="r-page-ind">1 / 1</div>
  </div>

  <div class="page-display" id="page-display">
    <!-- Image / PDF area -->
    <div class="page-img-wrap" id="page-img-wrap">
      <!-- static image mode -->
      <img id="page-img" src="" alt="" style="display:none">
      <!-- pdf canvas mode -->
      <canvas id="pdf-canvas" style="display:none"></canvas>
      <!-- loading -->
      <div id="pdf-loading" style="display:none">📖 加载中…</div>
      <!-- swipe dots -->
      <div class="swipe-dots" id="swipe-dots"></div>
    </div>
    <!-- Text band -->
    <div class="page-text-band" id="page-text-band">
      <div class="page-text-inner" id="r-text"></div>
    </div>
  </div>

  <div class="voice-area">
    <div class="voice-row">
      <button class="mic-btn idle" id="mic-btn" onclick="toggleMic()">🎙</button>
      <div class="voice-info">
        <div class="voice-status" id="v-status">点麦克风开始朗读</div>
        <div class="voice-transcript" id="v-transcript"> </div>
      </div>
      <div class="score-display" id="score-display" style="display:none">
        <div class="score-num" id="page-score-num">-</div>
        <div class="score-lbl">本页得分</div>
      </div>
    </div>
  </div>

  <div class="reading-footer">
    <button class="page-nav-btn page-nav-prev" id="prev-btn" onclick="prevPage()">← 上一页</button>
    <div class="session-avg" id="session-avg">平均分 —</div>
    <button class="page-nav-btn page-nav-next" id="next-btn" onclick="nextPage()">下一页 →</button>
  </div>
</div>

<!-- FINISH -->
<div class="screen" id="finish">
  <div class="finish-inner">
    <div class="finish-trophy" id="finish-trophy">🏆</div>
    <div class="finish-title" id="finish-title">太棒了！</div>
    <div class="finish-sub" id="finish-sub"></div>
    <div class="score-grid">
      <div class="score-box"><div class="score-box-num" id="fin-pages">0</div><div class="score-box-lbl">共几页</div></div>
      <div class="score-box"><div class="score-box-num" id="fin-avg">-</div><div class="score-box-lbl">平均分</div></div>
      <div class="score-box"><div class="score-box-num" id="fin-best">-</div><div class="score-box-lbl">最高页</div></div>
    </div>
    <div class="page-scores-list" id="fin-score-list"></div>
    <div style="display:flex;flex-direction:column;gap:12px;width:100%">
      <button class="btn-done" onclick="goToQuiz()">📝 做课后习题</button>
      <button style="background:none;border:none;color:var(--text2);font-size:15px;font-weight:700;cursor:pointer;padding:8px;font-family:var(--font)" onclick="backHome()">跳过，回首页</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="quiz">
  <div class="quiz-inner">
    <div class="quiz-header">
      <div class="quiz-book-title" id="quiz-book-title">课后练习</div>
      <div class="quiz-progress" id="quiz-progress">第 1 / 5 题</div>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill" style="width:20%"></div></div>
    </div>

    <!-- Loading state -->
    <div class="quiz-loading" id="quiz-loading">
      <span class="spinner">🤔</span>
      <div style="font-size:15px;font-weight:700">AI 正在出题…</div>
      <div style="font-size:13px;margin-top:6px">根据这本书生成专属习题</div>
    </div>

    <!-- Question area -->
    <div id="quiz-question-area" style="display:none;flex:1;display:flex;flex-direction:column">
      <div class="quiz-q-card">
        <div class="quiz-q-text" id="quiz-q-text"></div>
      </div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <button class="quiz-next-btn" id="quiz-next-btn" onclick="quizNext()">下一题 →</button>
    </div>

    <!-- Result area -->
    <div id="quiz-result-area" style="display:none">
      <div class="quiz-result">
        <div class="quiz-result-trophy" id="quiz-trophy">🏆</div>
        <div class="quiz-result-score" id="quiz-score-text">5/5</div>
        <div class="quiz-result-label" id="quiz-result-label">全对！太厉害了！</div>
        <button class="btn-done" onclick="backHome()">回到首页 🏠</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="books.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── STORAGE ──
function ls(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
const SK={tasks:'ra_tasks_v4',state:'ra_state_v4',hist:'ra_hist_v4'};

let tasks=ls(SK.tasks)||[];
let state=ls(SK.state)||{streak:0,total:0,lastDate:''};
let history=ls(SK.hist)||[];

// reading session
let RS={taskId:null,pdfDoc:null,totalPages:0,cur:0,pageTexts:[],pageScores:[],rec:null,isRec:false,finalText:''};

// ── DATE ──
function today(){return new Date().toISOString().slice(0,10);}

// ── INIT ──
function init(){
  const d=new Date();
  document.getElementById('today-label').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
  const h=d.getHours();
  document.getElementById('greeting').textContent=(h<12?'早上好！':h<18?'下午好！':'晚上好！')+' 一起读书吧 📖';
  renderHome();
}

// ── GENERATE TASKS ──
function generateTasks(){
  const td=today();
  if(tasks.filter(t=>t.date===td).length>0&&!confirm('今天已有任务，重新生成？'))return;
  tasks=tasks.filter(t=>t.date!==td);

  const carry=tasks.filter(t=>t.date<td&&!t.readDone);
  carry.forEach(t=>{t.date=td;t.isCarry=true;});
  tasks=tasks.filter(t=>!(t.date<td&&!t.readDone));
  tasks.push(...carry);

  const yest=new Date();yest.setDate(yest.getDate()-1);
  const yd=yest.toISOString().slice(0,10);
  const yids=tasks.filter(t=>t.date===yd&&t.readDone).map(t=>t.bookId);
  const revs=yids.map((bid,i)=>{
    const b=BOOKS_DATA.find(x=>x.id===bid);if(!b)return null;
    return mkTask(b,td,true,false,'rv_'+td+'_'+i);
  }).filter(Boolean);

  const used=new Set([...carry.map(t=>t.bookId),...revs.map(t=>t.bookId)]);
  const need=Math.max(0,5-revs.length-carry.length);
  const pool=BOOKS_DATA.filter(b=>!used.has(b.id)).sort(()=>Math.random()-.5).slice(0,need);
  const news=pool.map((b,i)=>mkTask(b,td,false,false,'nw_'+td+'_'+i));

  tasks.push(...revs,...news);
  lss(SK.tasks,tasks);
  renderHome();
}

function mkTask(b,date,isRev,isCarry,id){
  return{id,date,bookId:b.id,title:b.title,series:b.series,level:b.level,
    url:b.url,pdfPath:b.pdfPath||'',pages:b.pages||[],
    isReview:isRev,isCarry,readDone:false,recDone:false,quizDone:false,scores:[],avgScore:null};
}

// ── RENDER HOME ──
function renderHome(){
  const td=today();
  const tt=tasks.filter(t=>t.date===td);
  const done=tt.filter(t=>t.readDone).length;
  const total=tt.length;
  const pct=total?done/total:0;
  document.getElementById('ring').style.strokeDashoffset=314-314*pct;
  document.getElementById('ring-num').textContent=done+'/'+total;

  const cont=document.getElementById('task-container');
  if(!tt.length){
    cont.innerHTML=`<div class="empty-state"><div class="e-icon">✨</div><p>今天还没有任务</p><small>点下方按钮生成今日任务</small></div>`;
    return;
  }
  const carry=tt.filter(t=>t.isCarry);
  const revs=tt.filter(t=>t.isReview&&!t.isCarry);
  const news=tt.filter(t=>!t.isReview&&!t.isCarry);
  let html='';
  if(carry.length)html+=`<div class="section-label">⏩ 顺延任务</div>`+carry.map(taskHTML).join('');
  if(revs.length)html+=`<div class="section-label">📖 复习（读1遍）</div>`+revs.map(taskHTML).join('');
  if(news.length)html+=`<div class="section-label">✨ 新书（读2遍+录音）</div>`+news.map(taskHTML).join('');
  cont.innerHTML=html;
}

function taskHTML(t){
  const sp={RAZ:'pill-raz','牛津树':'pill-ox','红火箭':'pill-rr'}[t.series]||'';
  const iconClass=t.readDone?'icon-done':t.isReview?'icon-rev':'icon-new';
  const iconEmoji=t.readDone?'✅':t.isReview?'🔄':'📗';
  const hasPdf=t.pdfPath?'📄 ':'';
  return `
  <div class="task-card ${t.readDone?'done':''}" onclick="openReading('${t.id}')">
    <div class="task-icon ${iconClass}">${iconEmoji}</div>
    <div class="task-card-info">
      <div class="task-card-title">${hasPdf}${t.title}</div>
      <div class="task-card-meta">
        <span class="pill ${sp}">${t.series}</span>
        <span class="pill pill-lv">Level ${t.level}</span>
        ${t.isReview?'<span class="pill pill-rev">复习</span>':''}
        ${t.isCarry?'<span class="pill pill-carry">顺延</span>':''}
        ${!t.isReview&&!t.isCarry?'<span class="pill pill-new">新书</span>':''}
        ${t.avgScore!==null?`<span class="task-score-badge">${t.avgScore}</span>`:''}
      </div>
    </div>
    <div class="task-checks" onclick="event.stopPropagation()">
      <div><div class="mini-check ${t.readDone?'on':''}" onclick="toggleCheck('${t.id}','readDone')">${t.readDone?'✓':''}</div><div class="mini-check-lbl">读</div></div>
      <div><div class="mini-check ${t.recDone?'on':''}" onclick="toggleCheck('${t.id}','recDone')">${t.recDone?'✓':''}</div><div class="mini-check-lbl">录</div></div>
      <div><div class="mini-check ${t.quizDone?'on':''}" onclick="toggleCheck('${t.id}','quizDone')">${t.quizDone?'✓':''}</div><div class="mini-check-lbl">题</div></div>
    </div>
  </div>`;
}

function toggleCheck(id,field){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t[field]=!t[field];
  if(field==='readDone'&&t[field]){state.total++;bumpStreak();}
  lss(SK.tasks,tasks);lss(SK.state,state);
  renderHome();
}

function bumpStreak(){
  const td=today();if(state.lastDate===td)return;
  const yest=new Date();yest.setDate(yest.getDate()-1);
  state.streak=state.lastDate===yest.toISOString().slice(0,10)?state.streak+1:1;
  state.lastDate=td;
}

// ── READING MODE ──
async function openReading(tid){
  const t=tasks.find(x=>x.id===tid);if(!t)return;
  const bookDef=BOOKS_DATA.find(b=>b.id===t.bookId)||{};
  const extraAll=ls('ra_extra_books')||{};
  const extra=extraAll[t.bookId]||{};
  const pdfPath=bookDef.pdfPath||t.pdfPath||'';
  const pageTexts=(extra.pages&&extra.pages.length)?extra.pages:
                  (bookDef.pages&&bookDef.pages.length?bookDef.pages:(t.pages||[]));

  RS={taskId:tid,pdfDoc:null,totalPages:0,cur:0,pageTexts,pageScores:[],
      pageImages:[],rec:null,isRec:false,finalText:''};

  document.getElementById('r-title').textContent=t.title;
  showScreen('reading');

  const loading=document.getElementById('pdf-loading');
  const imgEl=document.getElementById('page-img');
  const canvasEl=document.getElementById('pdf-canvas');
  loading.style.display='flex';imgEl.style.display='none';canvasEl.style.display='none';

  // 1. 优先从 IndexedDB 读取图片
  const dbImages=await loadBookImages(t.bookId);

  if(dbImages.length){
    // ── IndexedDB 图片模式 ──
    RS.pageImages=dbImages;
    RS.totalPages=dbImages.length;
    loading.style.display='none';
    imgEl.style.display='block';
    renderImagePage();
  } else if(pdfPath){
    // ── PDF文件模式（兜底） ──
    try{
      const pdf=await pdfjsLib.getDocument(pdfPath).promise;
      RS.pdfDoc=pdf;
      const total=pdf.numPages;
      const startPage=3;
      const endPage=Math.max(startPage,total-2);
      RS.pdfStartPage=startPage;
      RS.totalPages=endPage-startPage+1;
      loading.style.display='none';
      canvasEl.style.display='block';
      await renderPDFPage();
    }catch(e){
      RS.pdfDoc=null;RS.totalPages=pageTexts.length||1;
      loading.style.display='none';renderTextOnly();
    }
  } else {
    // ── 纯文字模式 ──
    RS.totalPages=pageTexts.length||1;
    loading.style.display='none';
    renderTextOnly();
  }

  updatePageNav();
  initSwipe();
}

function renderImagePage(){
  const url=RS.pageImages[RS.cur]||'';
  const img=document.getElementById('page-img');
  if(url){img.src=url;img.style.display='block';}
  else{img.style.display='none';}
  renderPageText();
  updateSwipeDots();
}

async function renderPDFPage(){
  if(!RS.pdfDoc)return;
  const pageNum=RS.pdfStartPage+RS.cur;
  const canvas=document.getElementById('pdf-canvas');
  const wrap=document.getElementById('page-img-wrap');
  try{
    const page=await RS.pdfDoc.getPage(pageNum);
    const maxW=wrap.clientWidth||window.innerWidth;
    const maxH=wrap.clientHeight||300;
    const vp0=page.getViewport({scale:1});
    const scale=Math.min(maxW/vp0.width,maxH/vp0.height)*0.97;
    const vp=page.getViewport({scale});
    canvas.width=vp.width;canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  }catch(e){console.error(e);}
  renderPageText();
  updateSwipeDots();
}

function renderTextOnly(){
  document.getElementById('page-img').style.display='none';
  document.getElementById('pdf-canvas').style.display='none';
  renderPageText();
  updateSwipeDots();
}

function renderPageText(){
  const text=RS.pageTexts[RS.cur]||'';
  const el=document.getElementById('r-text');
  if(!text.trim()){
    el.innerHTML='<span class="no-text-hint">（本页暂无文字）</span>';return;
  }
  const words=text.split(/\s+/).filter(Boolean);
  el.innerHTML=words.map((w,i)=>`<span class="word" id="w${i}" data-word="${w.toLowerCase().replace(/[^a-z']/g,'')}">${w} </span>`).join('');
}

function renderTextPage(){renderTextOnly();}// alias kept for compat

function updateSwipeDots(){
  const dots=document.getElementById('swipe-dots');
  const n=Math.min(RS.totalPages,15);
  dots.innerHTML=Array.from({length:n},(_,i)=>
    `<div class="swipe-dot${i===RS.cur?' on':''}"></div>`).join('');
}

// ── SWIPE GESTURE ──
function initSwipe(){
  const wrap=document.getElementById('page-img-wrap');
  let sx=0,sy=0;
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){dx<0?nextPage():prevPage();}
  },{passive:true});
}

function updatePageNav(){
  document.getElementById('r-page-ind').textContent=(RS.cur+1)+' / '+RS.totalPages;
  document.getElementById('prev-btn').style.opacity=RS.cur===0?'0.3':'1';
  document.getElementById('next-btn').textContent=RS.cur===RS.totalPages-1?'完成 ✓':'下一页 →';
  document.getElementById('v-status').textContent='点麦克风开始朗读';
  document.getElementById('v-transcript').textContent=' ';
  document.getElementById('score-display').style.display='none';
  stopMic();
  updateAvg();
}

async function prevPage(){
  if(RS.cur>0){
    RS.cur--;
    if(RS.pageImages.length)renderImagePage();
    else if(RS.pdfDoc)await renderPDFPage();
    else renderTextOnly();
    updatePageNav();
  }
}

async function nextPage(){
  if(RS.cur<RS.totalPages-1){
    RS.cur++;
    if(RS.pageImages.length)renderImagePage();
    else if(RS.pdfDoc)await renderPDFPage();
    else renderTextOnly();
    updatePageNav();
  }else{
    finishReading();
  }
}

function exitReading(){stopMic();saveScores();showScreen('home');renderHome();}

function saveScores(){
  if(!RS.taskId||!RS.pageScores.length)return;
  const t=tasks.find(x=>x.id===RS.taskId);if(!t)return;
  t.scores=RS.pageScores;
  const valid=RS.pageScores.filter(s=>s>0);
  t.avgScore=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length*10)/10:null;
  lss(SK.tasks,tasks);
}

function finishReading(){
  stopMic();saveScores();
  const t=tasks.find(x=>x.id===RS.taskId);
  if(t){
    if(!t.readDone){t.readDone=true;state.total++;bumpStreak();lss(SK.tasks,tasks);lss(SK.state,state);}
    const valid=(t.scores||[]).filter(s=>s>0);
    const avg=valid.length?(valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1):null;
    const best=valid.length?Math.max(...valid).toFixed(1):null;
    document.getElementById('fin-pages').textContent=RS.totalPages;
    document.getElementById('fin-avg').textContent=avg||'—';
    document.getElementById('fin-best').textContent=best||'—';
    document.getElementById('finish-title').textContent=avg>=9?'太棒了！':avg>=7?'读得很好！':'继续加油！';
    document.getElementById('finish-sub').textContent=`《${t.title}》读完啦 🎉`;
    document.getElementById('finish-trophy').textContent=avg>=9?'🏆':avg>=7?'🥈':'📚';
    const list=document.getElementById('fin-score-list');
    list.innerHTML=t.scores&&t.scores.length
      ?t.scores.map((s,i)=>`<div class="page-score-row"><span>第 ${i+1} 页</span><span style="color:${s>=9?'var(--green)':s>=7?'var(--amber)':'var(--red)'}">${s>0?s.toFixed(1)+' 分':'—'}</span></div>`).join('')
      :'<div style="color:var(--text2);font-size:14px;text-align:center;padding:8px">暂无打分记录</div>';
  }
  showScreen('finish');
}

function backHome(){showScreen('home');renderHome();}

// ── VOICE ──
function toggleMic(){RS.isRec?stopMic():startMic();}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('请使用 Safari 浏览器并允许麦克风权限');return;}
  const rec=new SR();
  rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
  let final='';
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';
      else interim+=e.results[i][0].transcript;
    }
    RS.finalText=final;
    document.getElementById('v-transcript').textContent=(final+interim).trim()||' ';
    if(!RS.pdfDoc)highlightWords(final+interim);
  };
  rec.onend=()=>{if(RS.isRec)scoreAndShow(RS.finalText);RS.isRec=false;document.getElementById('mic-btn').className='mic-btn idle';document.getElementById('v-status').textContent='点麦克风重新朗读';};
  rec.onerror=e=>{document.getElementById('v-status').textContent='错误：'+e.error;RS.isRec=false;document.getElementById('mic-btn').className='mic-btn idle';};
  RS.rec=rec;RS.isRec=true;RS.finalText='';
  rec.start();
  document.getElementById('mic-btn').className='mic-btn rec';
  document.getElementById('v-status').textContent='录音中… 再按停止';
  document.getElementById('score-display').style.display='none';
}

function stopMic(){
  if(RS.rec){try{RS.rec.stop();}catch{}RS.rec=null;}
  RS.isRec=false;
  document.getElementById('mic-btn').className='mic-btn idle';
}

function scoreAndShow(spoken){
  const text=RS.pageTexts[RS.cur]||'';
  if(!text.trim()||!spoken.trim())return;
  const score=calcScore(text,spoken);
  RS.pageScores[RS.cur]=score;
  document.getElementById('page-score-num').textContent=score.toFixed(1);
  document.getElementById('score-display').style.display='block';
  updateAvg();
}

function calcScore(original,spoken){
  const norm=s=>s.toLowerCase().replace(/[^a-z\s']/g,' ').split(/\s+/).filter(Boolean);
  const orig=norm(original),sp=norm(spoken);
  if(!orig.length)return 10;
  const spSet=new Set(sp);
  const hits=orig.filter(w=>spSet.has(w)).length;
  const acc=hits/orig.length;
  const cov=Math.min(sp.length/Math.max(orig.length,1),1);
  return Math.round(Math.min((acc*.75+cov*.25)*10*1.03,10)*10)/10;
}

function highlightWords(spoken){
  const norm=s=>s.toLowerCase().replace(/[^a-z']/g,'');
  const spSet=new Set(spoken.split(/\s+/).map(norm).filter(Boolean));
  document.querySelectorAll('.word').forEach(el=>{
    el.className='word'+(spSet.has(el.dataset.word)?' hit':'');
  });
}

function updateAvg(){
  const valid=RS.pageScores.filter(s=>s>0);
  document.getElementById('session-avg').textContent=valid.length?'平均分 '+(valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1):'平均分 —';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── QUIZ ENGINE ──
let QS={questions:[],cur:0,correct:0,answered:false,bookTitle:''};

function goToQuiz(){
  const t=tasks.find(x=>x.id===RS.taskId);
  const bookDef=BOOKS_DATA.find(b=>b.id===(t&&t.bookId))||{};
  const pageTexts=bookDef.pages&&bookDef.pages.length?bookDef.pages:(t&&t.pages||[]);
  const bookTitle=t?t.title:'';
  QS={questions:[],cur:0,correct:0,answered:false,bookTitle};

  showScreen('quiz');
  document.getElementById('quiz-book-title').textContent='《'+bookTitle+'》课后练习';
  document.getElementById('quiz-loading').style.display='block';
  document.getElementById('quiz-question-area').style.display='none';
  document.getElementById('quiz-result-area').style.display='none';

  generateQuizQuestions(bookTitle, pageTexts);
}

async function generateQuizQuestions(title, pages){
  const textContent=pages.join('\n').trim();
  if(!textContent){
    // fallback: generic questions if no text
    QS.questions=fallbackQuestions(title);
    startQuiz();
    return;
  }
  const prompt=`You are a children's English reading tutor. Based on this picture book text, generate exactly 5 multiple-choice comprehension questions for a 7-year-old child.

Book title: "${title}"
Book text:
${textContent.slice(0,2000)}

Rules:
- Questions should be simple and fun, testing basic comprehension
- Each question has 4 options (A, B, C, D), exactly one correct
- Mix question types: what happened, who did what, how did they feel, what comes next
- Use simple vocabulary appropriate for age 7
- Return ONLY valid JSON, no markdown, no explanation

JSON format:
[
  {
    "q": "question text",
    "opts": ["option A", "option B", "option C", "option D"],
    "ans": 0
  }
]
(ans is the 0-based index of the correct option)`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await resp.json();
    const raw=data.content.find(b=>b.type==='text')?.text||'';
    const clean=raw.replace(/```json|```/g,'').trim();
    QS.questions=JSON.parse(clean).slice(0,5);
    startQuiz();
  }catch(e){
    console.error('quiz gen error',e);
    QS.questions=fallbackQuestions(title);
    startQuiz();
  }
}

function fallbackQuestions(title){
  return[
    {q:`Did you enjoy reading "${title}"?`,opts:['Yes, it was great!','It was okay','Not really','I didn\'t read it'],ans:0},
    {q:'What is a good thing to do after reading a book?',opts:['Tell someone what it was about','Forget about it','Never read again','Sleep immediately'],ans:0},
    {q:'Reading books helps us to...',opts:['Learn new words','Get bored','Watch TV','Play games'],ans:0},
    {q:'Which word means the same as "happy"?',opts:['Joyful','Angry','Sad','Tired'],ans:0},
    {q:'A good reader always...',opts:['Tries their best','Gives up quickly','Skips all the words','Never asks questions'],ans:0}
  ];
}

function startQuiz(){
  document.getElementById('quiz-loading').style.display='none';
  document.getElementById('quiz-question-area').style.display='flex';
  QS.cur=0;QS.correct=0;
  showQuizQuestion();
}

function showQuizQuestion(){
  const q=QS.questions[QS.cur];
  if(!q)return;
  QS.answered=false;
  const total=QS.questions.length;
  document.getElementById('quiz-progress').textContent=`第 ${QS.cur+1} / ${total} 题`;
  document.getElementById('quiz-progress-fill').style.width=((QS.cur+1)/total*100)+'%';
  document.getElementById('quiz-q-text').textContent=q.q;
  document.getElementById('quiz-feedback').textContent='';
  const nextBtn=document.getElementById('quiz-next-btn');
  nextBtn.classList.remove('show');
  nextBtn.textContent=QS.cur===total-1?'查看成绩 🎉':'下一题 →';

  const opts=document.getElementById('quiz-options');
  opts.innerHTML=q.opts.map((o,i)=>`
    <button class="quiz-opt" onclick="selectQuizOpt(${i})">${['A','B','C','D'][i]}. ${o}</button>
  `).join('');
}

function selectQuizOpt(i){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.questions[QS.cur];
  const btns=document.querySelectorAll('.quiz-opt');
  btns.forEach((b,idx)=>{
    if(idx===q.ans)b.classList.add('correct');
    else if(idx===i)b.classList.add('wrong');
  });
  const correct=i===q.ans;
  if(correct){QS.correct++;document.getElementById('quiz-feedback').textContent='✅ 正确！太棒了！';}
  else{document.getElementById('quiz-feedback').textContent='❌ 答错了，正确答案是 '+['A','B','C','D'][q.ans]+'。';}
  document.getElementById('quiz-next-btn').classList.add('show');
}

function quizNext(){
  QS.cur++;
  if(QS.cur>=QS.questions.length){showQuizResult();}
  else{showQuizQuestion();}
}

function showQuizResult(){
  document.getElementById('quiz-question-area').style.display='none';
  document.getElementById('quiz-result-area').style.display='block';
  const s=QS.correct,t=QS.questions.length;
  document.getElementById('quiz-score-text').textContent=s+'/'+t;
  const pct=s/t;
  document.getElementById('quiz-trophy').textContent=pct===1?'🏆':pct>=0.6?'🥈':'📚';
  document.getElementById('quiz-result-label').textContent=
    pct===1?'全对！太厉害了！':pct>=0.8?'非常棒，快全对了！':pct>=0.6?'不错哦，继续加油！':'再读一遍，你会更好的！';

  // mark quiz done
  const t2=tasks.find(x=>x.id===RS.taskId);
  if(t2&&!t2.quizDone){t2.quizDone=true;lss(SK.tasks,tasks);}
}

// ══════════════════════════════════════════
//  IndexedDB — 读取图片（与admin共用同一DB）
// ══════════════════════════════════════════
const _IDB={name:'ReadingAppDB',ver:1,store:'book_images',db:null};
function _openDB(){
  if(_IDB.db)return Promise.resolve(_IDB.db);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(_IDB.name,_IDB.ver);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(_IDB.store))db.createObjectStore(_IDB.store);};
    req.onsuccess=e=>{_IDB.db=e.target.result;res(_IDB.db);};
    req.onerror=e=>rej(e);
  });
}
async function idbGet(key){
  const db=await _openDB();
  return new Promise((res,rej)=>{
    const req=db.transaction(_IDB.store,'readonly').objectStore(_IDB.store).get(key);
    req.onsuccess=()=>res(req.result);req.onerror=e=>rej(e);
  });
}
async function idbKeys(){
  const db=await _openDB();
  return new Promise((res,rej)=>{
    const req=db.transaction(_IDB.store,'readonly').objectStore(_IDB.store).getAllKeys();
    req.onsuccess=()=>res(req.result);req.onerror=e=>rej(e);
  });
}
// 加载某本书的所有图片，返回 base64 dataURL 数组
async function loadBookImages(bookId){
  try{
    const keys=await idbKeys();
    const imgKeys=keys.filter(k=>String(k).startsWith(`img:${bookId}:`));
    if(!imgKeys.length)return[];
    // 按页码排序
    imgKeys.sort((a,b)=>parseInt(String(a).split(':')[2])-parseInt(String(b).split(':')[2]));
    const imgs=await Promise.all(imgKeys.map(k=>idbGet(k)));
    return imgs.filter(Boolean);
  }catch(e){console.error('idb load error',e);return[];}
}
